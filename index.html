<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>4 años juntos</title>
<style>
  html,body{margin:0;height:100%;background:#0a0612;overflow:hidden;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
    font-family:Georgia,"Times New Roman",serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #title{position:fixed;top:12%;left:0;right:0;text-align:center;color:#ffe3ec;pointer-events:none;
    text-shadow:0 0 18px rgba(255,80,130,.7);padding:0 20px;
    padding-top:env(safe-area-inset-top,0px)}
  #title h1{margin:0;font-size:clamp(34px,10vw,64px);font-weight:400;letter-spacing:1px;
    background:linear-gradient(90deg,#ffe3ec,#ff8fb1,#ffd27a,#ffe3ec);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;
    filter:drop-shadow(0 0 14px rgba(255,80,130,.7));animation:beat 2.6s ease-in-out infinite,shine 7s linear infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.07)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
  @keyframes shine{to{background-position:300% 0}}
  #title p{margin:10px 0 0;font-size:clamp(15px,4vw,20px);opacity:.85;font-style:italic}
  #open{position:fixed;bottom:calc(4% + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
    background:rgba(255,92,138,.9);color:#fff;border:0;border-radius:30px;padding:13px 26px;font:inherit;
    font-size:17px;box-shadow:0 0 20px rgba(255,80,130,.7);display:none;z-index:2}
  #mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:6;width:42px;height:42px;
    border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:20px;display:none}
  #letter{position:fixed;inset:0;background:rgba(10,6,18,.93);z-index:5;display:none;overflow-y:auto;
    -webkit-overflow-scrolling:touch;padding:calc(30px + env(safe-area-inset-top,0px)) 24px calc(40px + env(safe-area-inset-bottom,0px))}
  #letter.on{display:block}
  #card{max-width:520px;margin:0 auto;color:#ffe3ec;font-size:clamp(17px,4.6vw,20px);line-height:1.65}
  #card h2{text-align:center;font-weight:400;font-size:clamp(26px,8vw,36px);margin:0 0 22px;text-shadow:0 0 14px rgba(255,80,130,.7)}
  #card p{margin:0 0 18px;opacity:0;transform:translateY(12px);transition:opacity 1.2s,transform 1.2s}
  #card p.in{opacity:1;transform:none}
  #card .end{text-align:center;font-size:24px}
  #close{display:block;margin:26px auto 0;background:none;border:1px solid #ff9ebb;color:#ffb3c8;
    border-radius:30px;padding:10px 24px;font:inherit;font-size:16px}
  #hint{position:fixed;bottom:calc(8% + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;
    color:#ffb3c8;font-size:15px;letter-spacing:2px;pointer-events:none;animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.3}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">
  <h1>4 años</h1>
  <p>de ti y de mí 💗</p>
</div>
<audio id="bgm" src="cancion.mp3" loop preload="auto"></audio>
<button id="mute">🔊</button>
<button id="open">💌 Abrir mensaje</button>
<div id="letter"><div id="card"></div></div>
<div id="hint">TOCA LA PANTALLA ♥</div>

<script>
// ====== CONFIGURACIÓN ======
const MESSAGE = [
 "🌸 Por lo general se me olvidan las fechas 😢 pero hoy la recordé, y quise hacer algo especial y bonito para la niña 🥰🥰",
 "La niña es muy especial en mi vida ✨ Aunque por lo general no digo los sentimientos ni lo que siento, eres muy especial para mí, amorchis 💕 He aprendido muchas cosas contigo y siempre he querido dar lo mejor de mí para ti.",
 "Este aniversario es especial porque será el último aniversario de novios, Dios mediante 🙏 ¡y qué nervios!, porque son muchas cosas, amorchis 💍 Y aunque no nos ha ido de la mejor manera, sé que vamos a salir adelante 🌱 A diario siempre buscaré nuestro bienestar.",
 "Te amo mucho, mi vida ❤️ Amo mucho a la nariz 👃💖",
 "Quiero que sepas que el amor llega, se transforma y se queda en nuestros corazones 💞 Ha sido tanto que hemos llegado a los 4 años de novios 🥂 y aún sabemos que nos queda inmenso tiempo por compartir, grandes conversaciones por tener y momentos increíbles por vivir 🌍✨",
 "¡Te amo! 💘"
];
const PHOTOS = [];   // sin fotos en esta versión
const COLORS = ["#ff3d71","#ff6b9d","#ff9ebb","#ffd1dc","#ffffff","#ffc247","#c77dff"];
// ===========================

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize", resize); resize();

const rockets=[], sparks=[], hearts=[], stars=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=()=>COLORS[(Math.random()*COLORS.length)|0];

for(let i=0;i<70;i++) stars.push({x:Math.random(),y:Math.random(),r:rnd(.3,1.4),p:Math.random()*6});

function heartPath(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x, y+s*.35);
  ctx.bezierCurveTo(x-s*.1,y+s*.1, x-s*.6,y-s*.05, x-s*.5,y-s*.35);
  ctx.bezierCurveTo(x-s*.4,y-s*.65, x-s*.05,y-s*.6, x,y-s*.3);
  ctx.bezierCurveTo(x+s*.05,y-s*.6, x+s*.4,y-s*.65, x+s*.5,y-s*.35);
  ctx.bezierCurveTo(x+s*.6,y-s*.05, x+s*.1,y+s*.1, x,y+s*.35);
  ctx.closePath();
}

function launch(tx,ty,slow){
  const x0=tx+rnd(-20,20);
  rockets.push({x:x0, x0, y:H, tx, ty, vy:-rnd(14,17), c:pick(), slow:!!slow, p:0});
}

// ===== fotos dentro del corazón =====
const imgs=[]; let imgIdx=0;
PHOTOS.forEach(src=>{
  const im=new Image();
  im.onload=()=>{
    const big=document.createElement("canvas"); big.width=big.height=256;
    const sw=Math.min(im.width,im.height);
    big.getContext("2d").drawImage(im,(im.width-sw)/2,(im.height-sw)/2,sw,sw,0,0,256,256);
    const tiny=document.createElement("canvas"); tiny.width=tiny.height=16;
    tiny.getContext("2d").drawImage(big,0,0,16,16);   // versión difuminada
    imgs.push({big,tiny});
  };
  im.src=src;
});
const pics=[], ripples=[], words=[], amb=[], shoot=[];
const WORDS=["Te amo","4 años","Amorchis","Mi vida","💕","✨","el osito","porkis","💖","Mi amor","la niña tierna"];
function bigHeart(x,y){
  for(let i=0;i<90;i++){
    const t=i/90*Math.PI*2, hx=16*Math.pow(Math.sin(t),3),
      hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    sparks.push({x,y,vx:hx*.38,vy:hy*.38,life:1,d:.007,c:i%3?"#ff5c8a":"#ffd27a",r:2.6});
  }
  ripples.push({x,y,r:30,life:1});
  words.push({x,y:y-10,txt:"4 años 💗",s:32,life:1,vy:-.35});
}

function explode(x,y,k=1,photo=false){
  const s0=sparks.length, h0=hearts.length;
  ripples.push({x,y,r:20,life:1});
  if(Math.random()<.55) words.push({x,y:y-8,txt:WORDS[(Math.random()*WORDS.length)|0],s:rnd(18,26),life:1,vy:-rnd(.3,.6)});
  if(photo && imgs.length){
    pics.push({x,y,im:imgs[imgIdx++%imgs.length],age:0,w:rnd(0,6),size:Math.min(W*.55,240)});
  }
  const c1=pick(), c2=pick();
  // anillo clásico
  const n=46, sp=rnd(3,5);
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2, v=sp*rnd(.6,1.1);
    sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,d:rnd(.012,.02),c:i%2?c1:c2,r:rnd(1.2,2.2)});
  }
  // explosión en forma de corazón
  const m=36;
  for(let i=0;i<m;i++){
    const t=i/m*Math.PI*2;
    const hx=16*Math.pow(Math.sin(t),3);
    const hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    sparks.push({x,y,vx:hx*.2,vy:hy*.2,life:1,d:.012,c:"#ff5c8a",r:2.4});
  }
  // corazones que flotan
  for(let i=0;i<9;i++){
    hearts.push({x:x+rnd(-25,25),y:y+rnd(-25,25),vx:rnd(-1.4,1.4),vy:rnd(-2.6,-.6),
      s:rnd(12,30),life:1,d:rnd(.006,.011),c:pick(),w:rnd(0,6)});
  }
  for(let i=s0;i<sparks.length;i++) sparks[i].k=k;
  for(let i=h0;i<hearts.length;i++) hearts[i].k=k;
}

let tapN=0;
function tap(e){
  e.preventDefault();
  document.getElementById("hint").style.display="none";
  const pts = e.changedTouches ? [...e.changedTouches] : [e];
  pts.forEach(p=>{launch(p.clientX,p.clientY);tapN++;if(tapN%5===0){const bx=p.clientX,by=p.clientY;setTimeout(()=>bigHeart(bx,by),550);}});
  document.getElementById("open").style.display="block";
  startMusic();
  if(navigator.vibrate) navigator.vibrate(15);
}
cv.addEventListener("touchstart",tap,{passive:false});
cv.addEventListener("mousedown",tap);

// ===== música =====
const bgm=document.getElementById("bgm"), muteBtn=document.getElementById("mute");
let musicOn=false;
function startMusic(){
  if(musicOn) return;
  bgm.volume=.7;
  bgm.play().then(()=>{musicOn=true;muteBtn.style.display="block";}).catch(()=>{});
}
muteBtn.addEventListener("click",()=>{
  bgm.muted=!bgm.muted; muteBtn.textContent=bgm.muted?"🔇":"🔊";
});

// ===== carta =====
const letter=document.getElementById("letter"), card=document.getElementById("card");
card.innerHTML="<h2>Feliz aniversario 💖</h2>"+MESSAGE.map((t,i)=>
  "<p"+(i==MESSAGE.length-1?' class="end"':'')+">"+t+"</p>").join("")+
  '<button id="close">Volver a los fuegos 🎆</button>';
document.getElementById("open").addEventListener("click",()=>{
  letter.classList.add("on"); letter.scrollTop=0;
  card.querySelectorAll("p").forEach((p,i)=>{p.classList.remove("in");setTimeout(()=>p.classList.add("in"),500+i*1400);});
});
document.getElementById("close").addEventListener("click",()=>letter.classList.remove("on"));

// corazoncitos ambientales y estrellas fugaces
setInterval(()=>{ if(amb.length<26) amb.push({x:rnd(0,W),y:H+20,s:rnd(8,18),v:rnd(.4,1),w:rnd(0,6),c:pick()}); },600);
setInterval(()=>{ shoot.push({x:rnd(W*.3,W),y:rnd(0,H*.3),vx:-rnd(7,10),vy:rnd(3,5),life:1}); },4500);

// fuegos automáticos suaves
setInterval(()=>{ if(rockets.length<2) launch(rnd(W*.15,W*.85),rnd(H*.2,H*.5)); },2600);

function frame(t){
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="rgba(10,6,18,.22)";
  ctx.fillRect(0,0,W,H);

  stars.forEach(s=>{
    ctx.globalAlpha=.4+.4*Math.sin(t/700+s.p);
    ctx.fillStyle="#fff";ctx.fillRect(s.x*W,s.y*H,s.r,s.r);
  });
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="lighter";

  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    if(r.slow){
      r.p+=1/75; const e=1-Math.pow(1-Math.min(r.p,1),2.2);
      r.x=r.x0+(r.tx-r.x0)*e; r.y=H+(r.ty-H)*e;
      ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(r.x,r.y,2.6,0,7);ctx.fill();
      if(r.p>=1){explode(r.tx,r.ty,.55,true);rockets.splice(i,1);}
      continue;
    }
    r.y+=r.vy; r.vy*=.985;
    sparks.push({x:r.x,y:r.y,vx:rnd(-.4,.4),vy:rnd(.2,.9),life:1,d:.05,c:r.c,r:1.3});
    ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(r.x,r.y,2.2,0,7);ctx.fill();
    if(r.y<=r.ty || r.vy>-2.2){explode(r.x,r.y);rockets.splice(i,1);}
  }
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    const k=s.k||1; s.x+=s.vx*k; s.y+=s.vy*k; s.vx*=1-.015*k; s.vy=s.vy*(1-.015*k)+.045*k; s.life-=s.d*k;
    if(s.life<=0){sparks.splice(i,1);continue;}
    ctx.globalAlpha=s.life;ctx.fillStyle=s.c;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";
  for(let i=hearts.length-1;i>=0;i--){
    const h=hearts[i];
    const k=h.k||1; h.w+=.05*k; h.x+=(h.vx+Math.sin(h.w)*.5)*k; h.y+=h.vy*k; h.vy*=1-.005*k; h.life-=h.d*k;
    if(h.life<=0){hearts.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,h.life*1.5);
    ctx.fillStyle=h.c;ctx.shadowColor=h.c;ctx.shadowBlur=12;
    heartPath(h.x,h.y,h.s);ctx.fill();
  }
  ctx.shadowBlur=0;
  // corazones con foto: aparecen difuminados y se aclaran
  for(let i=pics.length-1;i>=0;i--){
    const p=pics[i];
    p.age+=1/330; p.w+=.02; p.y-=.22; p.x+=Math.sin(p.w)*.25;
    if(p.age>=1){pics.splice(i,1);continue;}
    const t=p.age, a=Math.min(1,t/.15,(1-t)/.25);
    const s=p.size*(.45+.55*(1-Math.pow(1-Math.min(1,t*3),3)));
    const sharp=Math.min(1,Math.max(0,(t-.12)/.4));
    ctx.save();
    ctx.globalAlpha=a; ctx.shadowColor="#ff5c8a"; ctx.shadowBlur=35; ctx.fillStyle="#ff5c8a";
    heartPath(p.x,p.y,s); ctx.fill();
    ctx.shadowBlur=0; heartPath(p.x,p.y,s); ctx.clip();
    const cx=p.x-.6*s, cy=p.y-.73*s;
    ctx.drawImage(p.im.tiny,cx,cy,1.2*s,1.2*s);
    ctx.globalAlpha=a*sharp; ctx.drawImage(p.im.big,cx,cy,1.2*s,1.2*s);
    ctx.restore();
    ctx.save(); ctx.globalAlpha=a*.9; ctx.strokeStyle="#ffd1dc"; ctx.lineWidth=3;
    heartPath(p.x,p.y,s); ctx.stroke(); ctx.restore();
  }
  // ---- decoración ----
  for(let i=amb.length-1;i>=0;i--){
    const a=amb[i]; a.y-=a.v; a.w+=.03; a.x+=Math.sin(a.w)*.4;
    if(a.y<-30){amb.splice(i,1);continue;}
    ctx.globalAlpha=.28; ctx.fillStyle=a.c; heartPath(a.x,a.y,a.s); ctx.fill();
  }
  ctx.lineCap="round";
  for(let i=shoot.length-1;i>=0;i--){
    const q=shoot[i]; q.x+=q.vx; q.y+=q.vy; q.life-=.02;
    if(q.life<=0){shoot.splice(i,1);continue;}
    ctx.globalAlpha=q.life; ctx.strokeStyle="#fff"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(q.x-q.vx*6,q.y-q.vy*6); ctx.stroke();
  }
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i]; r.r+=3.2; r.life-=.02;
    if(r.life<=0){ripples.splice(i,1);continue;}
    ctx.globalAlpha=r.life*.8; ctx.strokeStyle="#ff9ebb"; ctx.lineWidth=2;
    heartPath(r.x,r.y,r.r); ctx.stroke();
  }
  ctx.textAlign="center"; ctx.shadowColor="#ff5c8a"; ctx.shadowBlur=14;
  for(let i=words.length-1;i>=0;i--){
    const w=words[i]; w.y+=w.vy; w.life-=.012;
    if(w.life<=0){words.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,w.life*1.6); ctx.fillStyle="#ffe3ec";
    ctx.font="italic "+w.s+"px Georgia,serif"; ctx.fillText(w.txt,w.x,w.y);
  }
  ctx.shadowBlur=0; ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(()=>launch(W/2,H*.35),600);
</script>
</body>
</html>
